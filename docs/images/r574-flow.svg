<svg xmlns="http://www.w3.org/2000/svg" width="960" height="596" viewBox="0 0 960 596" role="img" aria-labelledby="title desc"><title id="title">Согласование звука</title><desc id="desc">Приоритет совместимого многоканального PCM.</desc><rect x="1" y="1" width="958" height="594" rx="22" fill="#0f172a" stroke="#334155"/><text x="36" y="45" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8" font-weight="700" text-anchor="start">ALEKS / GAMEFREE24   •   DTS WEBOS</text><text x="36" y="91" font-family="Arial, sans-serif" font-size="32" fill="#f8fafc" font-weight="700" text-anchor="start">Приоритет многоканального звука</text><text x="36" y="123" font-family="Arial, sans-serif" font-size="19" fill="#94a3b8" font-weight="400" text-anchor="start">Упрощённая схема выбора совместимого PCM.</text><rect x="36" y="148" width="426" height="380" rx="16" fill="#172235" stroke="#334155"/><text x="249" y="183" font-family="Arial, sans-serif" font-size="27" fill="#a7b7cd" font-weight="700" text-anchor="middle">R278</text><rect x="78" y="204" width="342" height="54" rx="16" fill="#26364c" stroke="#334155"/><text x="249" y="238" font-family="Arial, sans-serif" font-size="23" fill="#f8fafc" font-weight="700" text-anchor="middle">DTS 5.1</text><path d="M249 258v28" stroke="#a7b7cd" stroke-width="3"/><path d="M243 278l6 8 6 -8" fill="none" stroke="#a7b7cd" stroke-width="3"/><rect x="60" y="287" width="378" height="59" rx="16" fill="#233247" stroke="#334155"/><text x="249" y="323" font-family="Arial, sans-serif" font-size="22" fill="#e5edf8" font-weight="700" text-anchor="middle">PCM S16LE</text><rect x="498" y="148" width="426" height="380" rx="16" fill="#172235" stroke="#334155"/><text x="711" y="183" font-family="Arial, sans-serif" font-size="27" fill="#8ee1bf" font-weight="700" text-anchor="middle">R574</text><rect x="540" y="204" width="342" height="54" rx="16" fill="#26364c" stroke="#334155"/><text x="711" y="238" font-family="Arial, sans-serif" font-size="23" fill="#f8fafc" font-weight="700" text-anchor="middle">DTS 5.1</text><path d="M711 258v28" stroke="#8ee1bf" stroke-width="3"/><path d="M705 278l6 8 6 -8" fill="none" stroke="#8ee1bf" stroke-width="3"/><rect x="522" y="287" width="378" height="59" rx="16" fill="#233247" stroke="#334155"/><text x="711" y="323" font-family="Arial, sans-serif" font-size="22" fill="#e5edf8" font-weight="700" text-anchor="middle">S16LE / F32LE / S32LE</text><text x="249" y="380" font-family="Arial, sans-serif" font-size="20" fill="#bac7d6" font-weight="400" text-anchor="middle">При несовместимости</text><text x="249" y="407" font-family="Arial, sans-serif" font-size="20" fill="#f4ca8c" font-weight="400" text-anchor="middle">возможен переход в стерео</text><rect x="101" y="434" width="296" height="54" rx="16" fill="#3a2b1e" stroke="#8b6637"/><text x="249" y="467" font-family="Arial, sans-serif" font-size="22" fill="#f4ca8c" font-weight="700" text-anchor="middle">PCM 2.0 — возможен</text><text x="711" y="380" font-family="Arial, sans-serif" font-size="21" fill="#9ee7cb" font-weight="700" text-anchor="middle">Сначала сохранить 5.1</text><text x="711" y="407" font-family="Arial, sans-serif" font-size="19" fill="#bac7d6" font-weight="400" text-anchor="middle">Если формат совместим</text><rect x="537" y="434" width="52" height="43" rx="8" fill="#12352f" stroke="#2b6b5d"/><text x="563" y="462" font-family="Arial, sans-serif" font-size="17" fill="#9ee7cb" font-weight="700" text-anchor="middle">L</text><rect x="595" y="434" width="52" height="43" rx="8" fill="#12352f" stroke="#2b6b5d"/><text x="621" y="462" font-family="Arial, sans-serif" font-size="17" fill="#9ee7cb" font-weight="700" text-anchor="middle">R</text><rect x="653" y="434" width="52" height="43" rx="8" fill="#12352f" stroke="#2b6b5d"/><text x="679" y="462" font-family="Arial, sans-serif" font-size="17" fill="#9ee7cb" font-weight="700" text-anchor="middle">C</text><rect x="711" y="434" width="52" height="43" rx="8" fill="#12352f" stroke="#2b6b5d"/><text x="737" y="462" font-family="Arial, sans-serif" font-size="17" fill="#9ee7cb" font-weight="700" text-anchor="middle">SW</text><rect x="769" y="434" width="52" height="43" rx="8" fill="#12352f" stroke="#2b6b5d"/><text x="795" y="462" font-family="Arial, sans-serif" font-size="17" fill="#9ee7cb" font-weight="700" text-anchor="middle">SL</text><rect x="827" y="434" width="52" height="43" rx="8" fill="#12352f" stroke="#2b6b5d"/><text x="853" y="462" font-family="Arial, sans-serif" font-size="17" fill="#9ee7cb" font-weight="700" text-anchor="middle">SR</text><text x="711" y="507" font-family="Arial, sans-serif" font-size="16" fill="#bac7d6" font-weight="400" text-anchor="middle">Иначе — совместимое преобразование</text><text x="36" y="567" font-family="Arial, sans-serif" font-size="17" fill="#aab9cb" font-weight="400" text-anchor="start">Схема согласования, не гарантия физического вывода 5.1.</text></svg>