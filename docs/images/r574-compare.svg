<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title desc"><title id="title">Сравнение R278 и R574</title><desc id="desc">Сравнительная таблица возможностей двух версий.</desc><rect x="1" y="1" width="958" height="718" rx="22" fill="#0f172a" stroke="#334155"/><text x="36" y="45" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8" font-weight="700" text-anchor="start">ALEKS / GAMEFREE24   •   DTS WEBOS</text><text x="36" y="91" font-family="Arial, sans-serif" font-size="32" fill="#f8fafc" font-weight="700" text-anchor="start">R278 и R574: что изменилось</text><text x="36" y="123" font-family="Arial, sans-serif" font-size="19" fill="#94a3b8" font-weight="400" text-anchor="start">DTS Core сохранён. R574 — экспериментальная версия.</text><rect x="36" y="150" width="420" height="72" rx="16" fill="#1e293b" stroke="#334155"/><rect x="476" y="150" width="448" height="72" rx="16" fill="#12352f" stroke="#2b6b5d"/><text x="56" y="194" font-family="Arial, sans-serif" font-size="25" fill="#e2e8f0" font-weight="700" text-anchor="start">R278 · стабильная</text><text x="496" y="194" font-family="Arial, sans-serif" font-size="25" fill="#8ee1bf" font-weight="700" text-anchor="start">R574 · экспериментальная</text><rect x="36" y="246" width="888" height="72" rx="10" fill="#1b293e" stroke="#28374d"/><text x="52" y="270" font-family="Arial, sans-serif" font-size="16" fill="#a7b7cd" font-weight="700" text-anchor="start">DTS Stereo и 5.1</text><text x="52" y="299" font-family="Arial, sans-serif" font-size="21" fill="#e5edf8" font-weight="400" text-anchor="start">Поддерживаются</text><text x="496" y="299" font-family="Arial, sans-serif" font-size="21" fill="#9ee7cb" font-weight="700" text-anchor="start">Поддерживаются</text><rect x="36" y="328" width="888" height="72" rx="10" fill="#172235" stroke="#28374d"/><text x="52" y="352" font-family="Arial, sans-serif" font-size="16" fill="#a7b7cd" font-weight="700" text-anchor="start">Форматы PCM</text><text x="52" y="381" font-family="Arial, sans-serif" font-size="21" fill="#e5edf8" font-weight="400" text-anchor="start">S16LE</text><text x="496" y="381" font-family="Arial, sans-serif" font-size="21" fill="#9ee7cb" font-weight="700" text-anchor="start">S16LE / F32LE / S32LE</text><rect x="36" y="410" width="888" height="72" rx="10" fill="#1b293e" stroke="#28374d"/><text x="52" y="434" font-family="Arial, sans-serif" font-size="16" fill="#a7b7cd" font-weight="700" text-anchor="start">Сохранение 5.1</text><text x="52" y="463" font-family="Arial, sans-serif" font-size="21" fill="#e5edf8" font-weight="400" text-anchor="start">Зависит от согласования</text><text x="496" y="463" font-family="Arial, sans-serif" font-size="21" fill="#9ee7cb" font-weight="700" text-anchor="start">Приоритет исходных каналов</text><rect x="36" y="492" width="888" height="72" rx="10" fill="#172235" stroke="#28374d"/><text x="52" y="516" font-family="Arial, sans-serif" font-size="16" fill="#a7b7cd" font-weight="700" text-anchor="start">Смена формата</text><text x="52" y="545" font-family="Arial, sans-serif" font-size="21" fill="#e5edf8" font-weight="400" text-anchor="start">Без новых проверок</text><text x="496" y="545" font-family="Arial, sans-serif" font-size="21" fill="#9ee7cb" font-weight="700" text-anchor="start">Расширенное согласование</text><rect x="36" y="574" width="888" height="72" rx="10" fill="#1b293e" stroke="#28374d"/><text x="52" y="598" font-family="Arial, sans-serif" font-size="16" fill="#a7b7cd" font-weight="700" text-anchor="start">Диагностика</text><text x="52" y="627" font-family="Arial, sans-serif" font-size="21" fill="#e5edf8" font-weight="400" text-anchor="start">Базовая</text><text x="496" y="627" font-family="Arial, sans-serif" font-size="21" fill="#9ee7cb" font-weight="700" text-anchor="start">Расширенная проверка PCM</text><text x="36" y="690" font-family="Arial, sans-serif" font-size="17" fill="#aab9cb" font-weight="400" text-anchor="start">Вывод 5.1 на конкретном ресивере требует отдельной проверки.</text></svg>