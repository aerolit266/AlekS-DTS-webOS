name: AlekS DTS public release integrity

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'docs/**'
      - 'downloads/r278/**'
      - 'install-universal.sh'
      - 'README.md'
      - 'README.en.md'
      - 'PUBLIC-COMPATIBILITY.md'
      - '.github/workflows/dts-public-integrity.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout (pinned GitHub-maintained action)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate DTS release hashes, installers, source syntax and links
        run: python3 tools/audit-public-github-r322.py
