name: AlekS DTS public release integrity

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'docs/**'
      - 'downloads/r278/**'
      - 'install-universal.sh'
      - 'README.md'
      - 'README.en.md'
      - 'PUBLIC-COMPATIBILITY.md'
      - '.github/workflows/dts-public-integrity.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout (pinned GitHub-maintained action)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate DTS release hashes, installers, source syntax and links
        run: python3 tools/audit-public-github-r322.py
      - name: Validate exact released libdcadec DTS packet cardinality
        run: sh tools/run-r324-libdcadec-packet-cardinality.sh
      - name: Validate privacy-preserving R326 PulseAudio/ALSA parsers and PCM energy math
        run: |
          python3 tools/r326-passive-pulseaudio-alsa-snapshot.py selftest
          python3 tools/r326-pulse-monitor-energy.py selftest
          python3 tools/r327-real-dts-pair-compare.py --selftest
          python3 tools/r328-native-audio-route-readonly.py selftest
